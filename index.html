<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>업무노트</title>
<meta name="apple-mobile-web-app-title" content="업무노트">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 3-pane work desk — 분류 사이드바 | 메모 목록 | 편집 패널. 좁은 화면은 칩 + 목록, 편집은 전체 화면 시트
   Look: 밝은 회색 바탕 위 흰 카드, 큰 둥근 모서리, 옅은 그림자, 헤어라인 구분선, 알약 버튼, 반투명 메뉴 */
:root{
  --bg:#f5f5f7; --surface:#ffffff; --fill:rgba(118,118,128,.12); --hover:rgba(0,0,0,.04); --sel:rgba(0,0,0,.06);
  --line:rgba(60,60,67,.13); --grid:#b9b9c0; --fg:#1d1d1f; --muted:#6e6e73;
  --accent:#0071e3; --accent-ink:#ffffff; --accent-soft:rgba(0,113,227,.11);
  --t-todo:#007aff; --t-meeting:#af52de; --t-call:#ff9500; --t-client:#34c759; --t-daily:#8e8e93; --t-snippet:#5856d6; --t-info:#30b0c7; --t-routine:#ff9500; --t-mail:#ff2d55;
  --warn:#ff3b30; --warn-soft:rgba(255,59,48,.12); --soon:#c26b00; --soon-soft:rgba(255,149,0,.16);
  --glass:rgba(255,255,255,.78); --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05); --pop-shadow:0 12px 40px rgba(0,0,0,.16);
  --font-ui:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Segoe UI",system-ui,sans-serif;
  --font-mono:ui-monospace,"SF Mono","SFMono-Regular",Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1c1c1e; --fill:rgba(118,118,128,.24); --hover:rgba(255,255,255,.05); --sel:rgba(255,255,255,.09);
  --line:rgba(84,84,88,.55); --grid:#5a5a60; --fg:#f5f5f7; --muted:#98989d;
  --accent:#0a84ff; --accent-ink:#ffffff; --accent-soft:rgba(10,132,255,.2);
  --t-todo:#0a84ff; --t-meeting:#bf5af2; --t-call:#ff9f0a; --t-client:#30d158; --t-daily:#98989d; --t-snippet:#5e5ce6; --t-info:#40c8e0; --t-routine:#ff9f0a; --t-mail:#ff375f;
  --warn:#ff453a; --warn-soft:rgba(255,69,58,.2); --soon:#ff9f0a; --soon-soft:rgba(255,159,10,.18);
  --glass:rgba(44,44,46,.78); --shadow:0 0 0 1px rgba(255,255,255,.04); --pop-shadow:0 12px 40px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --fill:rgba(118,118,128,.24); --hover:rgba(255,255,255,.05); --sel:rgba(255,255,255,.09);
  --line:rgba(84,84,88,.55); --grid:#5a5a60; --fg:#f5f5f7; --muted:#98989d;
  --accent:#0a84ff; --accent-ink:#ffffff; --accent-soft:rgba(10,132,255,.2);
  --t-todo:#0a84ff; --t-meeting:#bf5af2; --t-call:#ff9f0a; --t-client:#30d158; --t-daily:#98989d; --t-snippet:#5e5ce6; --t-info:#40c8e0; --t-routine:#ff9f0a; --t-mail:#ff375f;
  --warn:#ff453a; --warn-soft:rgba(255,69,58,.2); --soon:#ff9f0a; --soon-soft:rgba(255,159,10,.18);
  --glass:rgba(44,44,46,.78); --shadow:0 0 0 1px rgba(255,255,255,.04); --pop-shadow:0 12px 40px rgba(0,0,0,.6); color-scheme:dark}
body{margin:0}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent-soft);outline-offset:1px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));gap:14px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:12px;margin-right:auto}
.brand h1{font-size:24px;font-weight:700;margin:0;letter-spacing:-.025em}
.brand small{color:var(--muted);font-size:13px}
.store{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;margin-right:4px}
.store i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.store.cloud i{background:var(--t-client)}
.btn{border:0;background:var(--fill);border-radius:980px;padding:7px 16px;font-size:13px;font-weight:500;transition:background .15s,filter .15s}
.btn:hover{filter:brightness(.96)}
.btn.primary{background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:default}
.btn.danger{color:var(--warn)}
.btn.danger.armed{background:var(--warn);color:#fff}
.desk{display:grid;grid-template-columns:210px minmax(280px,380px) minmax(0,1fr);gap:14px;min-height:0}
aside,.list-pane,.editor{min-height:0}
aside{display:flex;flex-direction:column;gap:18px;overflow:auto;padding-top:2px}
.group-label{font-size:12px;color:var(--muted);font-weight:600;margin:0 0 6px 10px}
.types{display:flex;flex-direction:column;gap:2px}
.type-btn{display:flex;align-items:center;gap:10px;border:0;background:none;padding:7px 10px;border-radius:9px;text-align:left;font-size:14px}
.type-btn:hover{background:var(--hover)}
.type-btn.on{background:var(--sel);font-weight:600}
.type-btn .dot{width:10px;height:10px;border-radius:50%;flex:none}
.type-btn .n{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:6px;padding:0 4px}
.tag{border:0;background:var(--fill);border-radius:980px;padding:3px 11px;font-size:12px;color:var(--fg)}
.tag:hover{filter:brightness(.96)}
.tag.on{background:var(--accent);color:var(--accent-ink)}
.list-pane{display:flex;flex-direction:column;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.list-tools{display:flex;gap:8px;padding:12px 12px 8px;flex-wrap:wrap}
.list-tools input{flex:1 1 140px;min-width:0;border:0;background:var(--fill);border-radius:10px;padding:8px 12px}
.list-tools input:focus,.list-tools select:focus{outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.list-tools select{border:0;background:var(--fill);border-radius:10px;padding:7px 10px;font-size:13px}
.list{overflow:auto;flex:1;min-height:0;padding:0 6px 6px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;padding:11px 12px;border-radius:10px;cursor:pointer;position:relative}
.item::after{content:"";position:absolute;left:44px;right:12px;bottom:0;height:1px;background:var(--line)}
.item:last-child::after,.item.sel::after,.item:has(+ .item.sel)::after{display:none}
.item:hover{background:var(--hover)}
.item.sel{background:var(--accent-soft)}
.item .chk{grid-row:1/3;margin-top:1px;width:20px;height:20px;border:1.5px solid rgba(128,128,128,.55);border-radius:50%;background:none;display:grid;place-items:center;padding:0;font-size:12px;line-height:1}
.item .chk.done{background:var(--t-todo);border-color:var(--t-todo);color:#fff}
.item .bar{grid-row:1/3;width:10px;height:10px;border-radius:50%;margin:6px 5px 0}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item.has-copy{padding-right:64px}
.item .copy{position:absolute;right:12px;top:50%;transform:translateY(-50%);border:0;background:var(--fill);color:var(--accent);border-radius:980px;padding:4px 11px;font-size:12px;font-weight:600}
.item .copy:hover{background:var(--accent);color:var(--accent-ink)}
.item.done .t{text-decoration:line-through;color:var(--muted)}
.item .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.mono{font-variant-numeric:tabular-nums}
.pill{font-size:11px;padding:1px 7px;border-radius:6px;font-weight:600;background:var(--fill);color:var(--muted)}
.pill.over{background:var(--warn-soft);color:var(--warn)}
.pill.soon{background:var(--soon-soft);color:var(--soon)}
.pin{color:var(--t-call);font-size:12px}
.empty{padding:40px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:14px;align-items:center}
.editor{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.ed-head{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ed-head .kind{font-size:12px;font-weight:600;padding:3px 10px;border-radius:980px;color:#fff}
.ed-head .stamp{font-size:12px;color:var(--muted);margin-right:auto}
.ed-body{flex:1;min-height:0;overflow:auto;padding:20px 22px 28px;display:flex;flex-direction:column;gap:16px}
.ed-title{border:0;border-bottom:1px solid var(--line);background:none;font-size:28px;font-weight:700;letter-spacing:-.025em;padding:2px 0 10px;width:100%}
.ed-title:focus{outline:none;border-color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:500;padding-left:2px}
.field input,.field select,.field textarea{border:0;background:var(--fill);border-radius:10px;padding:9px 12px;width:100%;transition:box-shadow .15s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;box-shadow:0 0 0 3px var(--accent-soft),inset 0 0 0 1px var(--accent)}
/* 입력칸 안에서 스크롤하지 않게: 글 길이에 맞춰 늘어나고(fit), 큰 내용 칸은 남는 공간을 채운다 */
.field textarea{min-height:84px;resize:none;overflow:hidden;line-height:1.6}
.field.wide{flex:1 0 auto}
.field.wide textarea{flex:1 0 auto;min-height:160px}
.placeholder{flex:1;display:grid;place-items:center;color:var(--muted);padding:24px;text-align:center}
.quick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.quick button{border:0;background:var(--fill);border-radius:980px;padding:6px 14px;font-size:13px;display:inline-flex;gap:7px;align-items:center}
.quick button:hover{filter:brightness(.96)}
.quick .dot{width:8px;height:8px;border-radius:50%}
.menu{position:relative}
.pop{position:absolute;right:0;top:calc(100% + 8px);background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border:1px solid var(--line);border-radius:12px;box-shadow:var(--pop-shadow);padding:5px;z-index:20;min-width:190px;display:flex;flex-direction:column}
.pop button{border:0;background:none;text-align:left;padding:8px 10px;border-radius:8px;display:flex;gap:10px;align-items:center}
.pop button:hover{background:var(--accent);color:var(--accent-ink)}
.pop .dot{width:9px;height:9px;border-radius:50%}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:30;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet .box{background:var(--surface);border-radius:18px;box-shadow:var(--pop-shadow);width:min(560px,100%);max-height:100%;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:10px}
.sheet .box strong{font-size:17px;letter-spacing:-.015em}
.sheet textarea{min-height:200px;border:0;background:var(--fill);border-radius:10px;padding:10px 12px;font-family:var(--font-mono);font-size:12px;width:100%}
/* 표: 탭으로 나뉜 줄을 표로 보여 주는 칸(.rich). 누르면 원래 글 칸으로 바뀌어 고친다 */
.field .rich{background:var(--fill);border-radius:10px;padding:9px 12px;min-height:84px;line-height:1.6;cursor:text;overflow-x:auto}
.field .rich > div{white-space:pre-wrap;word-break:break-word}
.field .rich table{border-collapse:collapse;margin:6px 0;background:var(--surface);font-size:13px}
.field .rich td{border:1px solid var(--grid);padding:5px 10px;vertical-align:top}
.field .rich tr:first-child td{font-weight:600;background:var(--sel)}
.field .rich a{color:var(--accent)}
.field.has-rich textarea,.field.has-rich.editing .rich{display:none}
.field.has-rich.editing textarea{display:block}
.field.wide .rich{flex:1 0 auto;min-height:160px}
.field .label{font-size:12px;color:var(--muted);font-weight:500;padding-left:2px}
/* 사진 */
.photos{display:flex;flex-wrap:wrap;gap:8px}
.ph{position:relative;width:96px;height:96px;border-radius:10px;overflow:hidden;background:var(--fill)}
.ph img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block}
.ph img:not([src]){visibility:hidden}
.ph-x{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:14px;line-height:22px;padding:0}
.ph-add{width:96px;height:96px;border-radius:10px;border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--accent);font-size:13px;font-weight:600;cursor:pointer}
.ph-add:hover{background:var(--hover)}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:35;display:grid;place-items:center;padding:16px;cursor:zoom-out;overflow:auto}
.viewer img{max-width:100%;max-height:100%;border-radius:6px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);color:var(--fg);box-shadow:var(--pop-shadow);border:1px solid var(--line);padding:9px 18px;border-radius:980px;font-size:13px;font-weight:500;z-index:40;width:max-content;max-width:calc(100% - 32px);text-align:center}
.mobile-only{display:none}
@media (max-width:900px){
  .desk{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
  aside{flex-direction:column;gap:8px;overflow:visible}
  .types{flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:2px}
  .type-btn{white-space:nowrap;flex:none;background:var(--surface);box-shadow:var(--shadow);border-radius:980px;padding:6px 12px}
  .type-btn.on{background:var(--fg);color:var(--bg)}
  .type-btn.on .n{color:inherit;opacity:.7}
  .type-btn .n{margin-left:4px}
  aside .tag-wrap .group-label{display:none}
  .tags{flex-wrap:nowrap;overflow-x:auto;padding:0}
  .tag{flex:none}
  .editor{position:fixed;inset:0;z-index:25;border-radius:0;box-shadow:none;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .editor.closed{display:none}
  .mobile-only{display:inline-flex}
  .app{padding-top:calc(44px + env(safe-area-inset-top,0px))} /* 휴대폰 상단 흐림(상태바) 아래로 제목을 한 줄 내림 */
  .brand{flex-basis:100%}
  .brand h1{font-size:30px}
  .store{margin-right:auto}
  .brand small{display:none}
  aside .group-label{display:none}
  /* 휴대폰(아이폰 Pro 402px 기준): 글자 16px(입력칸이 16px보다 작으면 iOS가 화면을 확대함), 누르는 곳 44px 안팎,
     목록은 작은 상자 안이 아니라 화면 전체로 스크롤, '+ 새 메모'는 엄지가 닿는 오른쪽 아래 */
  body{font-size:16px;-webkit-text-size-adjust:100%}
  button,input,select,textarea,.item{touch-action:manipulation}
  body:has(.editor:not(.closed)){overflow:hidden}
  .app{display:block;height:auto;min-height:100%;padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
  header{margin-bottom:14px}
  header .btn{padding:9px 16px;font-size:15px}
  .store{font-size:13px}
  .desk{display:flex;flex-direction:column;gap:12px}
  .type-btn{padding:9px 15px;font-size:15px}
  .tag{padding:6px 13px;font-size:14px}
  .list-pane{overflow:visible}
  .list-tools{position:sticky;top:0;z-index:5;background:var(--surface);border-radius:var(--r) var(--r) 0 0;padding:12px 12px 10px}
  .list-tools input,.list-tools select{font-size:16px;min-height:44px;padding:10px 12px}
  .list{overflow:visible;padding:0 4px 4px}
  .item{padding:14px 12px;gap:4px 14px}
  .item::after{left:52px}
  .item .t{font-size:16px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .item .meta{font-size:13px;gap:6px 9px}
  .pill{font-size:12px}
  .item .chk{width:26px;height:26px;font-size:14px;position:relative}
  .item .chk::before{content:"";position:absolute;inset:-10px} /* 동그라미보다 넓게 눌리도록 */
  .item .bar{margin:8px 8px 0}
  .item.has-copy{padding-right:84px}
  .item .copy{padding:9px 15px;font-size:14px}
  .empty{font-size:15px}
  .menu{position:fixed;z-index:22;right:max(18px,calc(env(safe-area-inset-right,0px) + 12px));bottom:calc(22px + env(safe-area-inset-bottom,0px))}
  #newBtn{padding:15px 24px;font-size:17px;box-shadow:0 8px 24px rgba(0,113,227,.35)}
  .pop{top:auto;bottom:calc(100% + 10px);min-width:220px}
  .pop button{padding:13px 14px;font-size:16px}
  .toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  /* 편집 화면 */
  .ed-head{flex-wrap:nowrap;gap:6px;padding:10px 12px}
  .ed-head .stamp{display:none}
  .ed-head .kind{margin-right:auto;white-space:nowrap}
  .ed-head .btn{padding:9px 14px;font-size:15px;white-space:nowrap}
  .ed-body{padding:18px 16px 48px;gap:18px}
  .ed-title{font-size:24px}
  .grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2 .field:has(input[type=text]),.grid2 .field:has(input[type=url]),.grid2 .field:has(input[type=password]){grid-column:1/-1}
  .field label,.field .label{font-size:13px}
  .field input,.field select,.field textarea{font-size:16px;min-height:44px;padding:10px 12px}
  .field .rich{font-size:16px}
  .field .rich table{font-size:14px}
  .ed-body .btn{padding:10px 16px;font-size:15px}
  .photos{gap:8px}
  .ph,.ph-add{width:calc((100% - 16px) / 3);height:auto;aspect-ratio:1}
  .ph-x{width:30px;height:30px;line-height:30px;font-size:17px}
  .sheet .box{padding:20px 16px}
  .sheet .btn{padding:10px 16px;font-size:15px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="brand"><h1>업무노트</h1><small>할 일 · 회의록 · 통화 · 거래처 · 업무일지</small></div>
    <span class="store" id="store"><i></i><span id="storeText">불러오는 중</span></span>
    <button class="btn" id="backupBtn" type="button">설정·백업</button>
    <div class="menu">
      <button class="btn primary" id="newBtn" type="button" aria-haspopup="true">+ 새 메모</button>
      <div class="pop" id="newPop" hidden></div>
    </div>
  </header>
  <div class="desk">
    <aside>
      <div><p class="group-label">분류</p><div class="types" id="types"></div></div>

          <option value="updated">최근 수정순</option>

    <div class="grid2">
      <div class="field"><label for="sheetUrl">웹 앱 주소</label><input id="sheetUrl" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off"></div>

<script>
const TYPES = {
  todo:   {name:"할 일", color:"--t-todo", fields:[
            {k:"due",l:"마감일",t:"date"},
            {k:"priority",l:"우선순위",t:"select",o:["높음","보통","낮음"]},
            {k:"status",l:"상태",t:"select",o:["대기","진행","완료"]},
            {k:"body",l:"내용",t:"area",wide:1}]},
  // 매일 할 일: 오늘 체크하면 fields.doneDate=오늘 날짜, 날짜가 바뀌면 자동으로 다시 '안 함'
  routine:{name:"매일 할 일", color:"--t-routine", fields:[
            {k:"time",l:"시간",t:"time"},
            {k:"repeat",l:"반복",t:"select",o:["매일","평일(월~금)"]},
            {k:"body",l:"내용",t:"area",wide:1,ph:"예: 전날 검진 결과 업로드 확인, 내일 예약자 문자 발송"}]},
  // 메일·요청: 거래처 메일로 받은 요청. 할 일처럼 체크·D-day·마감일 정렬이 된다
  // 메일·요청·회의록·업무일지는 분류를 줄이려고 숨김(hidden). 예전에 쓴 메모가 있으면 분류에 계속 보인다
  mail:   {name:"메일·요청", color:"--t-mail", hidden:1, fields:[
            {k:"received",l:"받은 날",t:"date"},
            {k:"due",l:"마감일",t:"date"},
            {k:"company",l:"거래처",t:"text",ph:"예: 마크로젠"},
            {k:"person",l:"보낸 사람",t:"text",ph:"예: 인사팀 과장님 (연락처·메일 주소는 메일 참고)"},
            {k:"status",l:"상태",t:"select",o:["대기","진행","완료"]},
            {k:"attach",l:"첨부",t:"text",ph:"예: 대상자 명단 첨부 있음 (내용은 옮기지 않기)"},
            {k:"body",l:"요청 내용",t:"area",wide:1,ph:"무엇을 보내야 하는지, 메일 제목 등"}]},
  meeting:{name:"회의록", color:"--t-meeting", hidden:1, fields:[
            {k:"date",l:"회의 날짜",t:"date"},
            {k:"attendees",l:"참석자",t:"text",ph:"예: 센터장님, 영업팀"},
            {k:"agenda",l:"안건",t:"area"},
            {k:"discussion",l:"논의 내용",t:"area",wide:1},
            {k:"decisions",l:"결정 사항",t:"area"},
            {k:"actions",l:"후속 조치 (담당자 · 기한)",t:"area"}]},
  // 통화·상담: 새로 만들지 않음(hidden). 예전에 쓴 메모가 있으면 분류에 계속 보인다
  call:   {name:"통화·상담", color:"--t-call", hidden:1, fields:[
            {k:"datetime",l:"일시",t:"datetime-local"},
            {k:"company",l:"회사",t:"text"},
            {k:"person",l:"담당자",t:"text"},
            {k:"phone",l:"연락처",t:"text"},
            {k:"question",l:"문의 내용",t:"area"},
            {k:"answer",l:"답변",t:"area"},
            {k:"nextDate",l:"다음 연락 예정일",t:"date"}]},
  client: {name:"거래처", color:"--t-client", fields:[
            {k:"person",l:"담당자",t:"text"},
            {k:"phone",l:"연락처",t:"text"},
            {k:"stage",l:"진행 단계",t:"select",o:["문의","제안","입찰","계약","진행 중","종료"]},
            {k:"period",l:"계약 기간",t:"text",ph:"예: 2027.01 ~ 2029.12"},
            {k:"notes",l:"특이사항",t:"area"},
            {k:"history",l:"히스토리",t:"area",wide:1,ph:"날짜별로 한 줄씩 적어 두면 보기 편합니다"}]},
  daily:  {name:"업무일지", color:"--t-daily", hidden:1, fields:[
            {k:"date",l:"날짜",t:"date"},
            {k:"done",l:"오늘 한 일",t:"area",wide:1},
            {k:"tomorrow",l:"내일 할 일",t:"area"},
            {k:"issues",l:"이슈·메모",t:"area"}]},
  snippet:{name:"자주 쓰는 문구", color:"--t-snippet", fields:[
            {k:"kind",l:"종류",t:"select",o:["메일","문자","카톡","기타"]},
            {k:"to",l:"받는 사람·쓰는 때",t:"text",ph:"예: 단체검진 문의 고객사"},
            {k:"subject",l:"메일 제목",t:"text"},
            {k:"body",l:"내용",t:"area",wide:1,ph:"고객사명처럼 바뀌는 부분은 ○○로 적어 두면 편합니다"}]},
  info:   {name:"정보", color:"--t-info", fields:[
            {k:"category",l:"구분",t:"text",ph:"예: 사내 연락처, 검진 항목, 업무 절차"},
            {k:"source",l:"링크·출처",t:"text",ph:"예: 사내 공지 주소, 담당 부서"},
            {k:"body",l:"내용",t:"area",wide:1}]}
};
const DUE_FIELD = {todo:"due", mail:"due", call:"nextDate", meeting:"date", daily:"date"};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

let memos = [], state = {type:"all", tag:null, q:"", sort:"updated", sel:null, draft:null};
let ui = {}; try { ui = JSON.parse(localStorage.getItem("memo-ui")||"{}"); } catch(e){}
if (ui.sort) state.sort = ui.sort; $("#sort").value = state.sort;

/* ---------- storage: 구글 시트(연결돼 있으면) → 클라우드(db) → 이 브라우저 ---------- */
const LKEY = "work-memos-v1", SKEY = "work-memos-sheet", QKEY = "work-memos-queue";
async function sheetApi(url, token, body){
  const ac = new AbortController(), timer = setTimeout(()=>ac.abort(), 25000);
  try {
    const r = await fetch(url, {method:"POST", body:JSON.stringify({...body, token}), signal:ac.signal});
    const j = await r.json();
    if (!j.ok) throw new Error(j.error||"error");
    return j;
  } finally { clearTimeout(timer); }
}
const store = {
  mode:"loading", col:null,
  sheet:null, queue:[], online:true, lastSync:0, chain:Promise.resolve(),
  async init(){
    try { this.sheet = JSON.parse(localStorage.getItem(SKEY)||"null"); } catch(e){}
    if (this.sheet && this.sheet.url && this.sheet.token) return this.useSheet();
    let db=null, user=null;
    if (window.claude && window.claude.use) {
      try { [db,user] = await Promise.all([claude.use("db"), claude.use("user")]); } catch(e){}
    }
    let id = null;
    if (db && user) { try { id = await user.id(); } catch(e){} }
    if (db && id) {
      this.mode="cloud"; this.col = db.collection("data/users/"+id);
      this.col.onSnapshot(snap => { memos = snap.docs.map(d => ({...d.data(), id:d.id})); render(); },
        () => { this.useLocal(); toast("클라우드 연결이 끊겨 이 브라우저 저장으로 바꿨습니다"); });
    } else this.useLocal();
    setStoreLabel();
  },
  useLocal(){
    this.mode="local"; this.col=null;
    try { memos = JSON.parse(localStorage.getItem(LKEY)||"[]"); } catch(e){ memos=[]; }
    setStoreLabel(); render();
  },
  persistLocal(){ try { localStorage.setItem(LKEY, JSON.stringify(memos)); } catch(e){ toast("브라우저 저장에 실패했습니다. 백업을 복사해 두세요"); } },
  async save(m){ return this.saveMany([m]); },
  async saveMany(arr){
    for (const m of arr){ const i = memos.findIndex(x=>x.id===m.id); if (i>=0) memos[i]=m; else memos.push(m); }
    if (this.mode==="sheet") { this.persistLocal(); this.enqueue(arr); }
    else if (this.mode==="cloud") {
      for (const m of arr){ const {id,...body}=m; try { await this.col.doc(m.id).set(body); } catch(e){ toast(e && e.code==="quota_exceeded" ? "저장 공간이 가득 찼습니다. 오래된 메모를 지워 주세요" : "저장하지 못했습니다. 잠시 후 다시 눌러 주세요"); return false; } }
    }
    else this.persistLocal();
    render(); return true;
  },
  async remove(id){
    memos = memos.filter(x=>x.id!==id);
    if (this.mode==="sheet") { this.persistLocal(); this.enqueue([{id, deleted:true, updatedAt:Date.now()}]); }
    else if (this.mode==="cloud") { try { await this.col.doc(id).delete(); } catch(e){ toast("삭제하지 못했습니다"); } }
    else this.persistLocal();
    render();
  },

  /* 구글 시트: 화면과 이 브라우저(캐시)에 먼저 반영하고, 보낼 변경은 대기열에 쌓았다가 순서대로 보낸다 */
  useSheet(){
    try { memos = JSON.parse(localStorage.getItem(LKEY)||"[]"); } catch(e){ memos=[]; }
    try { this.queue = JSON.parse(localStorage.getItem(QKEY)||"[]"); } catch(e){ this.queue=[]; }
    this.mode = memos.length ? "sheet" : "loading";
    setStoreLabel(); render();
    this.pull(true);
    setInterval(()=>{ if(!document.hidden) this.pull(); }, 60000);
    document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) this.pull(); });
    window.addEventListener("online", ()=>this.pull());
  },
  run(fn){ const p = this.chain.then(fn); this.chain = p.catch(()=>{}); return p; },
  persistQueue(){ try { localStorage.setItem(QKEY, JSON.stringify(this.queue)); } catch(e){} },
  enqueue(arr){
    const ids = new Set(arr.map(m=>m.id));
    this.queue = this.queue.filter(q=>!ids.has(q.id)).concat(JSON.parse(JSON.stringify(arr)));
    this.persistQueue(); setStoreLabel();
    this.run(()=>this.sendQueue());
  },
  async sendQueue(){
    while (this.queue.length) {
      const batch = this.queue.slice(0, 50);
      let res;
      try { res = await sheetApi(this.sheet.url, this.sheet.token, {action:"save", memos:batch}); this.online = true; }
      catch(e){ this.online = false; setStoreLabel(); if (e.message==="unauthorized") toast("시트 토큰이 맞지 않습니다. 설정에서 다시 연결해 주세요"); return false; }
      if (res.rejected && res.rejected.length) {
        const names = res.rejected.map(id=>(memos.find(m=>m.id===id)||{}).title||id).join(", ");
        toast("너무 길어서 시트에 저장하지 못했습니다: "+names);
      }
      this.queue = this.queue.filter(q=>!batch.includes(q)); this.persistQueue(); setStoreLabel();
    }
    return true;
  },
  overlayQueue(){
    for (const q of this.queue){
      const i = memos.findIndex(x=>x.id===q.id);
      if (q.deleted) { if (i>=0) memos.splice(i,1); }
      else if (i>=0) memos[i]=q; else memos.push(q);
    }
  },
  pull(full){ return this.run(async()=>{
    await this.sendQueue();
    full = full || !this.lastSync;
    let res;
    try { res = await sheetApi(this.sheet.url, this.sheet.token, {action:"list", since: full ? 0 : this.lastSync-10000}); this.online = true; }
    catch(e){ this.online = false; if (this.mode==="loading") { this.mode="sheet"; render(); } setStoreLabel(); return; }
    const before = JSON.stringify(memos);
    if (full) {
      const server = res.memos.filter(m=>!m.deleted);
      if (!this.sheet.synced) this.firstSync(server);
      memos = server;
    } else {
      for (const r of res.memos){
        const i = memos.findIndex(x=>x.id===r.id);
        if (r.deleted) { if (i>=0) memos.splice(i,1); }
        else if (i>=0) memos[i]=r; else memos.push(r);
      }
    }
    this.overlayQueue();
    this.lastSync = res.now; this.mode = "sheet";
    this.persistLocal(); setStoreLabel();
    if (JSON.stringify(memos)!==before) rerender();
    await this.sendQueue();
  }); },
  // 이 기기에서 처음 연결할 때: 이 브라우저에만 있던 메모를 시트로 올릴지 묻는다
  firstSync(server){
    const ids = new Set(server.map(m=>m.id)), mine = memos.filter(m=>!ids.has(m.id));
    if (mine.length) {
      if (confirm(`이 브라우저에만 있는 메모 ${mine.length}개를 구글 시트로 올릴까요?\n\n취소를 누르면 시트에 있는 메모만 보입니다. (이 브라우저 메모는 따로 보관해 둡니다)`)) {
        const ids2 = new Set(mine.map(m=>m.id));
        this.queue = this.queue.filter(q=>!ids2.has(q.id)).concat(mine); this.persistQueue();
      } else { try { localStorage.setItem(LKEY+"-before-sheet", JSON.stringify(mine)); } catch(e){} }
    }
    this.sheet.synced = true;
    try { localStorage.setItem(SKEY, JSON.stringify(this.sheet)); } catch(e){}
  }
};
function setStoreLabel(){
  const el=$("#store"), t=$("#storeText");
  if (store.mode==="sheet") {
    const n=store.queue.length;
    el.classList.toggle("cloud", store.online);
    t.textContent = !store.online ? (n ? `시트 연결 안 됨 · 대기 ${n}개` : "시트 연결 안 됨") : n ? `구글 시트 · 보내는 중 ${n}개` : "구글 시트 · 모든 기기";
    return;
  }
  el.classList.toggle("cloud", store.mode==="cloud");
  t.textContent = store.mode==="cloud" ? "계정에 저장 · 모든 기기" : store.mode==="local" ? "이 브라우저에 저장" : "불러오는 중";
}
// 동기화로 목록이 바뀔 때: 편집 중이던 입력·커서·스크롤은 그대로 둔다
function rerender(){
  const a=document.activeElement, id=a && a.id, s=a && a.selectionStart, e=a && a.selectionEnd;
  const body=$(".ed-body"), top=body ? body.scrollTop : 0, listTop=$("#list").scrollTop;
  readDraftSafe(); render();
  if ($(".ed-body")) $(".ed-body").scrollTop=top;
  $("#list").scrollTop=listTop;
  if (id) { const el=document.getElementById(id); if (el && el!==document.activeElement) {
    const rich=el.closest(".has-rich"); if (rich) { rich.classList.add("editing"); fit(el); }
    el.focus(); try { el.setSelectionRange(s,e); } catch(err){} } }
}

/* ---------- helpers ---------- */
function dueOf(m){ const k=DUE_FIELD[m.type]; return k ? (m.fields?.[k]||"").slice(0,10) : ""; }
function dday(dstr){
  if(!dstr) return null;
  const a=new Date(dstr+"T00:00:00"), b=new Date(today()+"T00:00:00");
  return Math.round((a-b)/86400000);
}
function isDone(m){ return m.type==="routine" ? m.fields?.doneDate===today() : (m.type==="todo"||m.type==="mail") && m.fields?.status==="완료"; }
function offToday(m){ const d=new Date().getDay(); return m.type==="routine" && m.fields?.repeat==="평일(월~금)" && (d===0||d===6); }
const newTypes = () => Object.entries(TYPES).filter(([k,v])=>!v.hidden);
function fmtDate(s){ return s ? s.replace(/-/g,".") : ""; }
function tagsOf(m){ return (m.tags||[]); }

/* ---------- render ---------- */
function filtered(){
  const q=state.q.trim().toLowerCase();
  let arr = memos.filter(m => (state.type==="all"||m.type===state.type) && (!state.tag||tagsOf(m).includes(state.tag)));
  if(q) arr = arr.filter(m => (m.title+" "+Object.values(m.fields||{}).join(" ")+" "+tagsOf(m).join(" ")).toLowerCase().includes(q));
  const key = state.sort;
  arr.sort((a,b)=>{
    if(!!b.pinned - !!a.pinned) return !!b.pinned - !!a.pinned;
    if(a.type==="routine" && b.type==="routine" && key!=="created"){ // 안 한 것 먼저, 시간순
      if(isDone(a)!==isDone(b)) return isDone(a)?1:-1;
      const ta=a.fields?.time||"99", tb=b.fields?.time||"99"; if(ta!==tb) return ta<tb?-1:1;
      return (a.createdAt||0)-(b.createdAt||0); }
    if(key==="due"){ const da=dueOf(a)||"9999", dbb=dueOf(b)||"9999"; if(isDone(a)!==isDone(b)) return isDone(a)?1:-1; return da<dbb?-1:da>dbb?1:0; }
    if(key==="created") return (b.createdAt||0)-(a.createdAt||0);
    return (b.updatedAt||0)-(a.updatedAt||0);
  });
  return arr;
}
function render(){
  // types
  const counts = {all:memos.length}; Object.keys(TYPES).forEach(k=>counts[k]=memos.filter(m=>m.type===k).length);
  $("#types").innerHTML = [["all","전체","--accent"],...Object.entries(TYPES).filter(([k,v])=>!v.hidden||counts[k]).map(([k,v])=>[k,v.name,v.color])].map(([k,n,c]) =>
    `<button type="button" class="type-btn ${state.type===k?"on":""}" data-type="${k}"><span class="dot" style="background:var(${c})"></span>${n}<span class="n">${counts[k]}</span></button>`).join("");
  // tags
  const allTags=[...new Set(memos.flatMap(tagsOf))].sort();
  $("#tags").innerHTML = allTags.length ? allTags.map(t=>`<button type="button" class="tag ${state.tag===t?"on":""}" data-tag="${esc(t)}">#${esc(t)}</button>`).join("")
    : `<span style="font-size:12px;color:var(--muted)">메모에 태그를 넣으면 여기에 모입니다</span>`;
  // list
  const arr=filtered();
  if(store.mode==="loading"){ $("#list").innerHTML=`<div class="empty">메모를 불러오는 중입니다</div>`; }
  else if(!memos.length){
    $("#list").innerHTML=`<div class="empty"><strong style="color:var(--fg)">아직 메모가 없습니다</strong><span>위의 '+ 새 메모'에서 양식을 골라 첫 메모를 만들어 보세요.<br>어떻게 쓰는지 먼저 보고 싶다면 예시를 넣어 볼 수 있습니다.</span><button class="btn" type="button" id="seed">예시 메모 5개 넣기</button></div>`;
  } else if(!arr.length){ $("#list").innerHTML=`<div class="empty">조건에 맞는 메모가 없습니다</div>`; }
  else $("#list").innerHTML = arr.map(m=>{
    const T=TYPES[m.type]; const d=dueOf(m), dd=dday(d), done=isDone(m);
    let due="";
    if(d && !done && m.type!=="meeting" && m.type!=="daily"){
      const cls = dd<0?"over":dd<=2?"soon":"";
      due=`<span class="pill ${cls} mono">${dd<0?`D+${-dd}`:dd===0?"오늘":`D-${dd}`}</span>`;
    }
    const sub = m.type==="client" ? (m.fields?.stage||"") : m.type==="call" ? [m.fields?.company,m.fields?.person].filter(Boolean).join(" · ")
      : m.type==="todo" ? [m.fields?.priority, m.fields?.status].filter(Boolean).join(" · ")
      : m.type==="mail" ? [m.fields?.company, m.fields?.status].filter(Boolean).join(" · ")
      : m.type==="snippet" ? [m.fields?.kind, m.fields?.to].filter(Boolean).join(" · ")
      : m.type==="info" ? (m.fields?.category||"")
      : m.type==="routine" ? [m.fields?.repeat, m.fields?.time].filter(Boolean).join(" · ") : "";
    if(m.type==="routine") due = offToday(m) ? `<span class="pill">오늘 쉼</span>` : done ? `<span class="pill">오늘 완료</span>` : "";
    const lead = (m.type==="todo"||m.type==="mail"||m.type==="routine")
      ? `<button type="button" class="chk ${done?"done":""}" data-check="${m.id}" aria-label="완료 표시">${done?"✓":""}</button>`
      : `<span class="bar" style="background:var(${T.color})"></span>`;
    const copy = m.type==="snippet" ? `<button type="button" class="copy" data-copy="${m.id}" aria-label="내용 복사">복사</button>` : "";
    return `<div class="item ${done?"done":""} ${copy?"has-copy":""} ${state.sel===m.id?"sel":""}" data-id="${m.id}" tabindex="0">${lead}${copy}
      <div class="t">${m.pinned?'<span class="pin">고정</span> ':""}${esc(m.title||"(제목 없음)")}</div>
      <div class="meta"><span style="color:var(${T.color});font-weight:600">${T.name}</span>${sub?`<span>${esc(sub)}</span>`:""}${d?`<span class="mono">${fmtDate(d)}</span>`:""}${due}${(m.photos||[]).length?`<span>사진 ${m.photos.length}</span>`:""}${tagsOf(m).map(t=>`<span>#${esc(t)}</span>`).join("")}</div></div>`;
  }).join("");
  renderEditor();
}

      <button class="btn" type="button" id="pinBtn">${m.pinned?"고정 해제":"고정"}</button>

      <button class="btn primary" type="button" id="saveBtn">저장</button>
    </div>
    <div class="ed-body">
      <input class="ed-title" id="f-title" value="${esc(m.title)}" placeholder="${m.type==="client"?"회사명":"제목"}" aria-label="제목">
      ${shortF.length?`<div class="grid2">${shortF.map(fieldHtml).join("")}</div>`:""}
      ${longF.map(fieldHtml).join("")}

      ${m.type==="snippet"?`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" type="button" id="copyBody">내용 복사</button><button class="btn" type="button" id="copySubject">메일 제목 복사</button></div>`:""}
      <div class="field"><span class="label">사진</span><div class="photos">${photos}<label class="ph-add">+ 사진<input type="file" accept="image/*" multiple id="photoInput" hidden></label></div></div>

function fit(ta){ ta.style.height="auto"; ta.style.height=ta.scrollHeight+"px"; }

/* ---------- 표: 엑셀·시트·웹에서 붙여 넣은 표는 탭으로 나뉜 줄로 저장하고, 보기에서는 표로 그린다 ---------- */
const hasTable = s => /\t/.test(s||"");
const linkify = h => h.replace(/https?:\/\/[^\s<]+/g, u=>`<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
function richHtml(s){
  const lines=String(s||"").replace(/\n+$/,"").split("\n"); let html="";
  for(let i=0;i<lines.length;){
    if(lines[i].includes("\t")){
      const rows=[]; while(i<lines.length && lines[i].includes("\t")) rows.push(lines[i++].split("\t"));
      const n=Math.max(...rows.map(r=>r.length));
      html+=`<table>${rows.map(r=>`<tr>${Array.from({length:n},(_,j)=>`<td>${linkify(esc(r[j]||""))}</td>`).join("")}</tr>`).join("")}</table>`;
    } else { html+=`<div>${linkify(esc(lines[i]))||"<br>"}</div>`; i++; }
  }
  return html;
}
// 웹페이지에서 복사한 표(HTML)를 탭·줄바꿈 글자로 바꾼다. 표 밖의 글은 줄 단위로 남긴다
function htmlToText(html){
  const doc=new DOMParser().parseFromString(html,"text/html"), out=[];
  const walk=n=>{
    if(n.nodeType===3){ out.push(n.nodeValue.replace(/\s+/g," ")); return; }
    if(n.nodeType!==1 || /^(SCRIPT|STYLE|HEAD)$/.test(n.tagName)) return;
    if(n.tagName==="TABLE"){ out.push("\n"+[...n.rows].map(r=>[...r.cells].map(c=>c.textContent.replace(/\s+/g," ").trim()).join("\t")).join("\n")+"\n"); return; }
    if(n.tagName==="BR"){ out.push("\n"); return; }
    const block=/^(P|DIV|LI|UL|OL|H[1-6]|SECTION|ARTICLE|BLOCKQUOTE|PRE)$/.test(n.tagName);
    if(block) out.push("\n"); n.childNodes.forEach(walk); if(block) out.push("\n");
  };
  walk(doc.body);
  return out.join("").replace(/ +\n/g,"\n").replace(/\n +/g,"\n").replace(/\n{3,}/g,"\n\n").trim();
}
function refreshRich(ta){
  const field=ta.closest(".field"); if(!field) return;
  let rich=field.querySelector(".rich");
  if(!hasTable(ta.value)){ field.classList.remove("has-rich","editing"); if(rich) rich.remove(); return; }
  if(!rich){ rich=document.createElement("div"); rich.className="rich"; rich.title="눌러서 고치기"; ta.before(rich); }
  rich.innerHTML=richHtml(ta.value); field.classList.add("has-rich"); field.classList.remove("editing");
}

/* ---------- 사진: 줄여서(긴 변 2000px JPEG) 드라이브에 올리고, 메모에는 {id,w,h}만 남긴다 ---------- */
const photoCache=new Map();
function photoSrc(id){
  if(!photoCache.has(id)){
    const p=sheetApi(store.sheet.url, store.sheet.token, {action:"image", id}).then(r=>`data:${r.mime};base64,${r.data}`);
    p.catch(()=>photoCache.delete(id)); photoCache.set(id,p);
  }
  return photoCache.get(id);
}
function loadPhotos(root){
  if(store.mode!=="sheet" || !store.sheet) return;
  root.querySelectorAll("img[data-photo]").forEach(img=>photoSrc(img.dataset.photo).then(src=>{ img.src=src; }).catch(()=>{ img.alt="불러오지 못함"; }));
}
async function shrink(file){
  const url=URL.createObjectURL(file), img=new Image();
  try { await new Promise((ok,no)=>{ img.onload=ok; img.onerror=no; img.src=url; }); } finally { URL.revokeObjectURL(url); }
  const k=Math.min(1, 2000/Math.max(img.naturalWidth,img.naturalHeight)), c=document.createElement("canvas");
  c.width=Math.round(img.naturalWidth*k); c.height=Math.round(img.naturalHeight*k);
  const g=c.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height);
  return {dataUrl:c.toDataURL("image/jpeg",0.85), w:c.width, h:c.height};
}
async function addPhotos(files){
  const imgs=[...files].filter(f=>f.type.startsWith("image/")), d=state.draft;
  if(!imgs.length || !d) return;
  if(store.mode!=="sheet"){ toast("사진은 구글 시트에 연결한 뒤 넣을 수 있습니다"); return; }
  readDraft(); toast(`사진 ${imgs.length}장 올리는 중…`);
  let n=0;
  for(const f of imgs){
    try {
      const s=await shrink(f);
      const r=await sheetApi(store.sheet.url, store.sheet.token, {action:"upload", name:(f.name||"사진").replace(/\.\w+$/,"")+".jpg", mime:"image/jpeg", data:s.dataUrl.split(",")[1]});
      photoCache.set(r.id, Promise.resolve(s.dataUrl));
      (d.photos ||= []).push({id:r.id, w:s.w, h:s.h}); n++;
    } catch(err){ toast(err.message==="unknown_action" ? "Apps Script를 새 버전으로 배포해야 사진을 넣을 수 있습니다" : "사진을 올리지 못했습니다. 잠시 후 다시 해 주세요"); }
  }
  if(!n) return;
  if(state.draft===d) await saveDraft();
  else { d.updatedAt=Date.now(); d.createdAt ||= d.updatedAt; await store.save(JSON.parse(JSON.stringify(d))); }
  toast(`사진 ${n}장을 넣었습니다`);
}
function readDraft(){
  const m=state.draft; if(!m) return;
  m.title=$("#f-title").value.trim();
  m.fields=m.fields||{};
  document.querySelectorAll("#editor [data-f]").forEach(el=>m.fields[el.dataset.f]=el.value);
  m.tags=$("#f-tags").value.split(",").map(s=>s.trim().replace(/^#/,"")).filter(Boolean);
}
function newMemo(type){
  const f={};
  if(type==="todo"){ f.priority="보통"; f.status="대기"; }
  if(type==="mail"){ f.received=today(); f.status="대기"; }
  if(type==="routine") f.repeat="매일";
  if(type==="meeting"||type==="daily") f.date=today();
  if(type==="call"){ const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); f.datetime=d.toISOString().slice(0,16); }
  if(type==="daily") return {id:uid(),type,title:fmtDate(today())+" 업무일지",fields:f,tags:[],pinned:false};
  return {id:uid(),type,title:"",fields:f,tags:[],pinned:false};
}
function openMemo(m){ state.sel=m.id; state.draft=JSON.parse(JSON.stringify(m)); render(); setTimeout(()=>{ const t=$("#f-title"); if(t && !m.title) t.focus(); },0); }
async function saveDraft(){
  readDraft(); const m=state.draft; if(!m) return;
  const now=Date.now(); if(!m.createdAt) m.createdAt=now; m.updatedAt=now;
  if(!m.title) m.title = m.type==="client" ? "이름 없는 거래처" : TYPES[m.type].name+" "+fmtDate(today());
  if(await store.save(JSON.parse(JSON.stringify(m)))){ state.sel=m.id; toast("저장했습니다"); }
}
async function copyText(s, what){
  if(!s){ toast(what+"이 비어 있습니다"); return; }
  try{ await navigator.clipboard.writeText(s); toast(what+"을 복사했습니다"); }
  catch(err){
    const ta=document.createElement("textarea"); ta.value=s; ta.style.cssText="position:fixed;opacity:0"; document.body.appendChild(ta); ta.select();
    let ok=false; try{ ok=document.execCommand("copy"); }catch(e2){} ta.remove();
    toast(ok ? what+"을 복사했습니다" : "복사하지 못했습니다. 메모를 열어 직접 선택해 주세요");
  }
}
let toastT; function toast(s){ const t=$("#toast"); t.textContent=s; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2200); }

document.addEventListener("click", async e=>{
  const img=e.target.closest("img[data-photo]");
  if(img){ if(img.src){ $("#viewerImg").src=img.src; $("#viewer").hidden=false; } return; }
  if(e.target.closest("#viewer")){ $("#viewer").hidden=true; return; }
  const rich=e.target.closest(".rich");
  if(rich && !e.target.closest("a")){ const f=rich.closest(".field"), ta=f.querySelector("textarea"); f.classList.add("editing"); fit(ta); ta.focus(); return; }
  const b=e.target.closest("button,[data-id]");
  if(!e.target.closest(".menu")) $("#newPop").hidden=true;
  if(!b) return;
  if(b.id==="newBtn"){ const p=$("#newPop"); p.hidden=!p.hidden; return; }
  if(b.dataset.new){ $("#newPop").hidden=true; openMemo(newMemo(b.dataset.new)); return; }
  if(b.dataset.type){ state.type=b.dataset.type; render(); return; }
  if(b.dataset.tag){ state.tag = state.tag===b.dataset.tag?null:b.dataset.tag;
    if(state.tag) state.type="all"; // 태그를 고르면 분류와 상관없이 그 태그의 메모를 모두 보여 준다
    readDraftSafe(); render(); return; }
  if(b.dataset.check){ e.stopPropagation(); const m=memos.find(x=>x.id===b.dataset.check); if(!m) return;
    const c=JSON.parse(JSON.stringify(m)), k = c.type==="routine" ? "doneDate" : "status";
    if(c.type==="routine") c.fields.doneDate = isDone(m) ? "" : today(); else c.fields.status = c.fields.status==="완료"?"대기":"완료";
    c.updatedAt=Date.now();
    if(state.draft?.id===c.id) state.draft.fields[k]=c.fields[k]; await store.save(c); return; }
  if(b.dataset.copy){ e.stopPropagation(); const m=memos.find(x=>x.id===b.dataset.copy); if(m) await copyText(m.fields?.body, "내용"); return; }
  if(b.dataset.unphoto){
    if(!confirm("이 사진을 메모에서 뺄까요?\n(드라이브 '업무노트 사진' 폴더에는 그대로 남습니다)")) return;
    readDraft(); state.draft.photos=(state.draft.photos||[]).filter(p=>p.id!==b.dataset.unphoto); await saveDraft(); return; }
  if(b.id==="copyBody"){ readDraft(); await copyText(state.draft.fields.body, "내용"); return; }
  if(b.id==="copySubject"){ readDraft(); await copyText(state.draft.fields.subject, "메일 제목"); return; }
  if(b.dataset.id){ const m=memos.find(x=>x.id===b.dataset.id); if(m) openMemo(m); return; }
  if(b.id==="saveBtn"){ saveDraft(); return; }
  if(b.id==="back"){ state.draft=null; state.sel=null; render(); return; }
  if(b.id==="pinBtn"){ readDraft(); state.draft.pinned=!state.draft.pinned; if(memos.some(x=>x.id===state.draft.id)) await saveDraft(); else renderEditor(); return; }
  if(b.id==="delBtn"){
    if(!b.classList.contains("armed")){ b.classList.add("armed"); b.textContent="한 번 더 누르면 삭제"; setTimeout(()=>{ if(b.isConnected){ b.classList.remove("armed"); b.textContent="삭제"; } },3000); return; }
    const id=state.draft.id; state.draft=null; state.sel=null; await store.remove(id); toast("삭제했습니다"); return; }
  if(b.id==="toTodo"){ readDraft(); const lines=(state.draft.fields.actions||"").split("\n").map(s=>s.trim().replace(/^[-•·]\s*/,"")).filter(Boolean);
    if(!lines.length){ toast("후속 조치 칸에 한 줄에 하나씩 적어 주세요"); return; }
    await saveDraft(); const base=state.draft.title;
    await store.saveMany(lines.map(l=>{ const t=newMemo("todo"); t.title=l; t.fields.body="회의: "+base; t.tags=[...(state.draft.tags||[])]; t.createdAt=t.updatedAt=Date.now(); return t; }));
    toast(`할 일 ${lines.length}개를 만들었습니다`); return; }
  if(b.id==="seed"){ await seed(); return; }
  if(b.id==="backupBtn"){ $("#backupText").value=JSON.stringify(memos,null,1);
    const s=store.sheet||{}; $("#sheetUrl").value=s.url||""; $("#sheetToken").value=s.token||"";
    $("#sheetState").textContent = store.mode==="sheet" ? "연결됨" : "연결 안 됨 · 이 브라우저에만 저장"; $("#sheetOff").hidden = store.mode!=="sheet";
    $("#sheet").hidden=false; return; }
  if(b.id==="sheetOn"){ const url=$("#sheetUrl").value.trim(), token=$("#sheetToken").value.trim();
    if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)){ toast("웹 앱 주소는 https://script.google.com/…/exec 형식입니다"); return; }
    if(!token){ toast("토큰을 넣어 주세요"); return; }
    b.disabled=true; b.textContent="확인 중";
    try{ await sheetApi(url, token, {action:"list", since:Date.now()}); }
    catch(err){ toast(err.message==="unauthorized" ? "토큰이 맞지 않습니다" : "연결하지 못했습니다. 주소와 배포 설정(모든 사용자)을 확인해 주세요"); b.disabled=false; b.textContent="연결"; return; }
    try{ localStorage.setItem(SKEY, JSON.stringify({url, token, synced:store.sheet?.url===url && !!store.sheet?.synced})); }catch(err){}
    location.reload(); return; }
  if(b.id==="sheetOff"){
    if(store.queue.length && !confirm(`아직 시트로 못 보낸 변경이 ${store.queue.length}개 있습니다. 연결을 끊으면 이 변경은 시트에 올라가지 않습니다. 계속할까요?`)) return;
    try{ localStorage.removeItem(SKEY); localStorage.removeItem(QKEY); }catch(err){}
    location.reload(); return; }
  if(b.id==="closeSheet"){ $("#sheet").hidden=true; return; }
  if(b.id==="copyBackup"){ const ta=$("#backupText"); try{ await navigator.clipboard.writeText(ta.value); toast("복사했습니다"); }catch(err){ ta.focus(); ta.select(); toast("선택된 내용을 Ctrl+C로 복사하세요"); } return; }
  if(b.id==="restoreBackup"){ let arr; try{ arr=JSON.parse($("#backupText").value); if(!Array.isArray(arr)) throw 0; }catch(err){ toast("백업 형식이 아닙니다. 복사한 내용을 그대로 붙여넣어 주세요"); return; }
    const ok=arr.filter(m=>m && m.id && TYPES[m.type]); await store.saveMany(ok); $("#sheet").hidden=true; toast(`메모 ${ok.length}개를 복원했습니다`); return; }
});

});
document.addEventListener("input", e=>{ if(e.target.matches("#editor textarea")) fit(e.target); });
document.addEventListener("focusout", e=>{ if(e.target.matches?.("#editor textarea")) refreshRich(e.target); });
document.addEventListener("change", e=>{ if(e.target.id==="photoInput"){ const files=[...e.target.files]; e.target.value=""; addPhotos(files); } });
document.addEventListener("paste", e=>{
  const cd=e.clipboardData; if(!cd || !state.draft || !e.target.closest?.("#editor")) return;
  const plain=cd.getData("text/plain"), html=cd.getData("text/html");
  const files=[...cd.files].filter(f=>f.type.startsWith("image/"));
  if(files.length && !plain){ e.preventDefault(); addPhotos(files); return; } // 캡처 이미지 붙여넣기
  const ta=e.target; if(!ta.matches("textarea")) return;
  if(hasTable(plain) || !/<table/i.test(html)) return; // 엑셀·구글 시트는 이미 탭으로 들어온다
  const before=ta.value.slice(0,ta.selectionStart), lead = before && !before.endsWith("\n") ? "\n" : "";
  e.preventDefault(); ta.setRangeText(lead+htmlToText(html)+"\n", ta.selectionStart, ta.selectionEnd, "end"); fit(ta);
});
window.addEventListener("resize", ()=>document.querySelectorAll("#editor textarea").forEach(fit));
$("#q").addEventListener("input",e=>{ state.q=e.target.value; readDraftSafe(); render(); });
$("#sort").addEventListener("change", e=>{ state.sort=e.target.value; try{ localStorage.setItem("memo-ui", JSON.stringify({sort:state.sort})); }catch(err){} readDraftSafe(); render(); });
function readDraftSafe(){ if(state.draft && $("#f-title")) readDraft(); }
$("#newPop").innerHTML = newTypes().map(([k,v])=>`<button type="button" data-new="${k}"><span class="dot" style="background:var(${v.color})"></span>${v.name}</button>`).join("");

async function seed(){
  const now=Date.now(), d=n=>{ const x=new Date(); x.setDate(x.getDate()+n); x.setMinutes(x.getMinutes()-x.getTimezoneOffset()); return x.toISOString().slice(0,10); };
  const ex=[
    {type:"todo",title:"[예시] 독감 예방접종 제안서 센터장님 보고",fields:{due:d(1),priority:"높음",status:"진행",body:"단가표, 접종 일정안 첨부"},tags:["예시","제안서"]},
    {type:"snippet",title:"[예시] 검진 일정 안내 문자",fields:{kind:"문자",to:"단체검진 고객사 담당자",subject:"",body:"안녕하세요, 진헬스검진센터입니다. ○○ 임직원 검진 일정은 ○월 ○일입니다. 전날 저녁 9시 이후 금식 부탁드립니다."},tags:["예시"]},
    {type:"routine",title:"[예시] 내일 검진 예약자 안내 문자 발송",fields:{time:"16:00",repeat:"평일(월~금)",body:"예약 명단 확인 후 '자주 쓰는 문구'에서 안내 문자 복사"},tags:["예시"]},
    {type:"client",title:"[예시] 예시상사",fields:{person:"인사팀 담당자",phone:"02-000-0000",stage:"제안",period:"",notes:"오전 검진 선호",history:"10.15 첫 문의\n10.21 일정 안내"},tags:["예시","단체검진"]},
    {type:"info",title:"[예시] 사내 내선번호",fields:{category:"사내 연락처",source:"",body:"부서\t내선\n접수\t101\n상담\t102"},tags:["예시"]}
  ];
  await store.saveMany(ex.map((m,i)=>({...m,id:uid(),pinned:i===0,createdAt:now-i*1000,updatedAt:now-i*1000})));
  toast("예시 메모를 넣었습니다. 확인 후 지워도 됩니다");
}

render();
store.init();
// 날짜가 바뀌면 '매일 할 일' 체크가 풀린 화면으로 다시 그린다
let shownDay = today();
setInterval(()=>{ if(today()!==shownDay){ shownDay=today(); rerender(); } }, 60000);
</script>
